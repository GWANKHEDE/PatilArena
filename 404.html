<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PatilArena</title>
    <script>
      // GitHub Pages SPA redirect
      // Stores the full path in sessionStorage, then redirects to index.html
      var path = window.location.pathname;
      var base = '/PatilArena';
      var rest = path.startsWith(base) ? path.slice(base.length) : path;
      sessionStorage.setItem('gh-pages-redirect', rest + window.location.search);
      window.location.replace(base + '/');
    </script>
  </head>
  <body></body>
</html>
